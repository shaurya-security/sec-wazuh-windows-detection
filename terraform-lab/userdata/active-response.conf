<!--
  Active response block, merged into /var/ossec/etc/ossec.conf by wazuh.sh.

  Kept as a standalone S3 payload so the AR wiring is versioned and applied
  automatically at boot - the previous design left it as a shell script in the
  user's home directory that nobody ever ran, so Scenario 1's AR never fired.

  The matching agent-side binary (task-kill.cmd + task-kill.ps1) is deployed
  by windows.ps1 into the agent's active-response\bin directory. Both halves
  must be present or the AR silently no-ops.
-->

  <command>
    <name>task-kill</name>
    <executable>task-kill.cmd</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>task-kill</command>
    <location>local</location>
    <rules_id>115100</rules_id>
  </active-response>
